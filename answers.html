<title>תשובות לבוחן – שמואל ב פרקים א, ה</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1d2433;--muted:#5b6475;--accent:#1f7a4d;--bg:#fbfaf7;--line:#e4e1d8;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Assistant",sans-serif;font-size:17px;line-height:1.6}
  main{max-width:820px;margin:0 auto;padding:28px 18px 60px}
  header{border-bottom:3px solid var(--accent);padding-bottom:12px;margin-bottom:18px}
  h1{font-family:"Frank Ruhl Libre",serif;font-size:2rem;margin:0 0 4px}
  header p{margin:0;color:var(--muted)}
  h2{font-family:"Frank Ruhl Libre",serif;font-size:1.35rem;margin:30px 0 6px;color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:4px}
  table{width:100%;border-collapse:collapse;margin:8px 0;background:#fff}
  td,th{border:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
  th{background:#e6f1ea}
  .a{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:12px 0;break-inside:avoid}
  .a b.n{color:var(--accent)}
  ul{padding-right:22px;margin:4px 0}
  .quote{font-family:"Frank Ruhl Libre",serif}
  @media print{body{background:#fff;font-size:13px}main{padding:0}}

  nav{font-size:.95rem;margin-bottom:12px}
  nav a{color:#2f4fa3;text-decoration:none}
  #gate{max-width:380px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center}
  #gate h1{font-size:1.6rem}
  #gate p{color:var(--muted);margin:6px 0 16px}
  #gate input{font:inherit;width:100%;border:1px solid #c9c5b8;border-radius:8px;padding:10px;text-align:center}
  #gate button{font:inherit;font-weight:700;width:100%;margin-top:10px;border:0;border-radius:8px;padding:11px;background:var(--accent);color:#fff;cursor:pointer}
  #err{color:#b3361f;min-height:1.4em;margin-top:8px;font-size:.95rem}
</style>
</head>
<body>
<main>
<nav><a href="index.html">→ חזרה לעמוד הראשי</a></nav>
<form id="gate" autocomplete="off">

  <input type="password" id="pw" placeholder="סיסמה" autofocus>
  <button type="submit">פתיחה</button>
  <div id="err" aria-live="polite"></div>
</form>
<div id="content"></div>
</main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById("gate").addEventListener("submit", async e => {
  e.preventDefault();
  const err = document.getElementById("err"); err.textContent = "";
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.s), iterations:200000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.i)}, key, b64(P.c));
    document.getElementById("content").innerHTML = new TextDecoder().decode(plain);
    document.getElementById("gate").remove();
  } catch (x) {
    err.textContent = "סיסמה שגויה";
  }
});
